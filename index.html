<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>WhatsApp Radar — Vini</title>
  <style>
    :root {
      --bg:#fafafa; --surface:#fff; --line:#e7e7e9; --line-soft:#f1f1f3;
      --text:#14171e; --text-2:#3a4256; --muted:#7c7a72;
      --accent:#10b981; --accent-soft:#d1fae5; --warn:#f59e0b;
      --danger:#ef4444; --info:#6366f1; --info-soft:#e0e7ff;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;min-height:100dvh}
    .wrap{max-width:1080px;margin:0 auto;padding:32px 24px 64px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px}.brand-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
    h1{font-size:22px;font-weight:650;margin:0}.subtitle{color:var(--muted);font-size:12.5px;margin-top:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .status-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;font-size:12px;font-weight:600}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px}
    .stat,.chat-list,.history{background:var(--surface);border:1px solid var(--line);border-radius:16px}.stat{padding:18px 20px}
    .stat-label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}.stat-value{font-size:28px;font-weight:650;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.stat-delta{margin-top:4px;font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .delta-up{color:var(--warn)}.delta-down{color:var(--accent)}.delta-same{color:var(--muted)}
    section{margin-bottom:32px}.section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}.section-title{font-size:15px;font-weight:650;margin:0}.section-meta{color:var(--muted);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .chat-list{overflow:hidden}.chat-row{display:grid;grid-template-columns:48px 1fr 100px 48px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-soft)}.chat-row:last-child{border-bottom:0}.chat-avatar{width:36px;height:36px;border-radius:50%;background:var(--info-soft);color:var(--info);display:grid;place-items:center;font-size:13px;font-weight:700}.chat-name{font-weight:650}.chat-snippet,.chat-time{color:var(--muted);font-size:12.5px}.chat-snippet{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-time{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.chat-unread{justify-self:end;min-width:28px;height:22px;padding:0 6px;display:inline-grid;place-items:center;border-radius:11px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .history{padding:6px 0}.history-row{display:grid;grid-template-columns:120px 90px 1fr 90px;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line-soft)}.history-row:last-child{border-bottom:0}.history-time,.history-count,.history-delta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.history-count{font-weight:700}.history-note{color:var(--muted);font-size:12.5px}
    .empty{padding:32px 24px;text-align:center;color:var(--muted)}.error{color:var(--danger)}
    footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:32px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.debug-strip{display:inline-flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;margin-top:8px;padding:4px 10px;border:1px dashed var(--line);border-radius:6px;font-size:10.5px}.debug-fresh{color:var(--accent)}.debug-stale{color:var(--warn)}.debug-very-stale{color:var(--danger)}
    @media(max-width:720px){.chat-row{grid-template-columns:40px 1fr 48px}.chat-time{display:none}.history-row{grid-template-columns:1fr;gap:4px}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="brand-icon">◉</div><div><h1>WhatsApp Radar</h1><div class="subtitle" id="subtitle">carregando snapshot...</div></div></div>
    <div class="status-pill" id="statusPill"><span class="dot"></span><span id="status">loading</span></div>
  </header>

  <section><div class="stats" id="stats"></div></section>

  <section>
    <div class="section-header"><h2 class="section-title">Top 5 não lidas</h2><span class="section-meta" id="top5meta">—</span></div>
    <div class="chat-list" id="top5"><div class="empty">carregando...</div></div>
  </section>

  <section>
    <div class="section-header"><h2 class="section-title">Histórico de ticks</h2><span class="section-meta">últimos 20</span></div>
    <div class="history" id="history"><div class="empty">carregando...</div></div>
  </section>

  <footer>
    <div>Atualizado pelo cron <code>whatsapp-radar-15min</code> · dados carregados de <code>data.json</code></div>
    <div style="margin-top:4px">auto-refresh em <code id="countdown">05:00</code></div>
    <div class="debug-strip"><span>data <code id="debugDataTs">—</code></span><span>·</span><span>data age <code id="debugDataAge">—</code></span><span>·</span><span>page age <code id="debugPageAge">—</code></span><span>·</span><span>next tick <code id="debugNextTick">—</code></span></div>
  </footer>
</div>
<script>
'use strict';

const REFRESH_MS = 5 * 60 * 1000;
const HISTORY_LIMIT = 20;
const pageLoadedAt = Date.now();
let nextRefreshAt = Date.now() + REFRESH_MS;
let currentDataTimestamp = null;

function asFiniteNumber(value, fallback = null) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function normalizeChat(raw) {
  if (!raw || typeof raw !== 'object') return null;
  return {
    name: String(raw.name || raw.label || 'Chat'),
    time: String(raw.time || ''),
    snippet: String(raw.snippet || ''),
    unread: Math.max(0, asFiniteNumber(raw.unread, 0))
  };
}

function normalizeHistoryEntry(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const rawTop = Array.isArray(raw.top) ? raw.top : (Array.isArray(raw.top5) ? raw.top5 : []);
  return {
    timestamp: typeof raw.timestamp === 'string' ? raw.timestamp : null,
    conversasNaoLidas: asFiniteNumber(raw.conversasNaoLidas, null),
    msgsNaoLidas: asFiniteNumber(raw.msgsNaoLidas, null),
    chatsComUnread: asFiniteNumber(raw.chatsComUnread, null),
    deltaConvos: asFiniteNumber(raw.deltaConvos, null),
    deltaMsgs: asFiniteNumber(raw.deltaMsgs, null),
    top: rawTop.map(normalizeChat).filter(Boolean).slice(0, 5)
  };
}

function normalizeSnapshot(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('snapshot inválido');
  const history = Array.isArray(raw.history) ? raw.history.map(normalizeHistoryEntry).filter(Boolean).slice(0, HISTORY_LIMIT) : [];
  return {
    timestamp: typeof raw.timestamp === 'string' ? raw.timestamp : null,
    conversasNaoLidas: asFiniteNumber(raw.conversasNaoLidas, null),
    msgsNaoLidas: asFiniteNumber(raw.msgsNaoLidas, null),
    chatsComUnread: asFiniteNumber(raw.chatsComUnread, null),
    deltaConvos: asFiniteNumber(raw.deltaConvos, null),
    deltaMsgs: asFiniteNumber(raw.deltaMsgs, null),
    proximoTick: typeof raw.proximoTick === 'string' ? raw.proximoTick : null,
    top5: Array.isArray(raw.top5) ? raw.top5.map(normalizeChat).filter(Boolean).slice(0, 5) : [],
    history
  };
}

function fmt(value) { return value == null ? '—' : String(value); }
function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function fmtDelta(value) {
  if (value == null) return { text:'baseline', cls:'delta-same' };
  if (value > 0) return { text:'↑ +' + value, cls:'delta-up' };
  if (value < 0) return { text:'↓ ' + value, cls:'delta-down' };
  return { text:'— 0', cls:'delta-same' };
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = String(text);
  return node;
}

async function loadSnapshot() {
  const url = 'data.json?cb=' + Date.now();
  const response = await fetch(url, { cache:'no-store', credentials:'same-origin' });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  return normalizeSnapshot(await response.json());
}

function renderStats(snap) {
  const stats = document.getElementById('stats');
  clear(stats);
  const items = [
    ['conversas não lidas', fmt(snap.conversasNaoLidas), fmtDelta(snap.deltaConvos)],
    ['msgs não lidas (soma)', fmt(snap.msgsNaoLidas), fmtDelta(snap.deltaMsgs)],
    ['chats com unread', fmt(snap.chatsComUnread), { text:'na lista principal', cls:'delta-same' }],
    ['próximo tick', fmtTime(snap.proximoTick), { text:'a cada 15 min', cls:'delta-same' }]
  ];
  for (const [label, value, delta] of items) {
    const card = el('div','stat');
    card.append(el('div','stat-label',label));
    const valueNode = el('div','stat-value',value);
    if (label === 'próximo tick') valueNode.style.fontSize = '18px';
    card.append(valueNode, el('div','stat-delta ' + delta.cls,delta.text));
    stats.append(card);
  }
}

function renderTop5(snap) {
  const root = document.getElementById('top5');
  const meta = document.getElementById('top5meta');
  clear(root);
  if (!snap.top5.length) {
    meta.textContent = 'minimizado';
    root.append(el('div','empty','Detalhes de contatos e mensagens não são publicados neste dashboard.'));
    return;
  }
  meta.textContent = snap.top5.length + ' chats';
  for (const chat of snap.top5) {
    const row = el('div','chat-row');
    const initials = chat.name.trim().split(/\s+/).slice(0,2).map(p => p.slice(0,1)).join('').toUpperCase() || '?';
    row.append(el('div','chat-avatar',initials));
    const body = el('div');
    body.append(el('div','chat-name',chat.name), el('div','chat-snippet',chat.snippet));
    row.append(body, el('div','chat-time',chat.time), el('div','chat-unread',chat.unread));
    root.append(row);
  }
}

function renderHistory(snap) {
  const root = document.getElementById('history');
  clear(root);
  if (!snap.history.length) { root.append(el('div','empty','sem histórico ainda')); return; }
  for (const item of snap.history) {
    const delta = fmtDelta(item.deltaConvos);
    const row = el('div','history-row');
    row.append(el('div','history-time',fmtTime(item.timestamp)));
    row.append(el('div','history-count',fmt(item.conversasNaoLidas) + ' conv'));
    const note = item.msgsNaoLidas == null ? '—' : fmt(item.msgsNaoLidas) + ' msgs';
    row.append(el('div','history-note',note));
    row.append(el('div','history-delta ' + delta.cls,delta.text));
    root.append(row);
  }
}

function render(snap) {
  currentDataTimestamp = snap.timestamp ? new Date(snap.timestamp).getTime() : null;
  document.getElementById('subtitle').textContent = 'último tick: ' + fmtTime(snap.timestamp);
  document.getElementById('status').textContent = 'live';
  document.getElementById('debugDataTs').textContent = fmtTime(snap.timestamp);
  document.getElementById('debugNextTick').textContent = fmtTime(snap.proximoTick);
  renderStats(snap); renderTop5(snap); renderHistory(snap);
}

function renderError(error) {
  document.getElementById('status').textContent = 'erro';
  document.getElementById('subtitle').textContent = 'falha ao carregar data.json';
  const root = document.getElementById('top5'); clear(root);
  root.append(el('div','empty error','Não foi possível carregar o snapshot: ' + error.message));
}

async function bootstrap() {
  try { render(await loadSnapshot()); } catch (error) { console.error(error); renderError(error); }
}

function tickDebug() {
  const now = Date.now();
  const remain = Math.max(0, nextRefreshAt - now);
  const m = Math.floor(remain / 60000), s = Math.floor((remain % 60000) / 1000);
  document.getElementById('countdown').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  document.getElementById('debugPageAge').textContent = Math.floor((now - pageLoadedAt) / 1000) + 's';
  const age = document.getElementById('debugDataAge');
  if (currentDataTimestamp && Number.isFinite(currentDataTimestamp)) {
    const mins = Math.max(0, Math.floor((now - currentDataTimestamp) / 60000));
    age.textContent = mins + 'm';
    age.className = mins > 45 ? 'debug-very-stale' : (mins > 20 ? 'debug-stale' : 'debug-fresh');
  } else age.textContent = '—';
}

bootstrap();
setInterval(tickDebug, 1000);
setInterval(() => { nextRefreshAt = Date.now() + REFRESH_MS; bootstrap(); }, REFRESH_MS);
tickDebug();
</script>
</body>
</html>
