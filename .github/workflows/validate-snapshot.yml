name: validate snapshot

on:
  push:
    paths:
      - 'data.json'
      - 'scripts/validate-snapshot.mjs'
  pull_request:
    paths:
      - 'data.json'
      - 'scripts/validate-snapshot.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-snapshot.mjs data.json
